# Compose PRODUCTION — VPS IONOS via Coolify.
# Traefik (géré par Coolify) termine le TLS et route le domaine vers `api:8000` :
# définir le FQDN (evkha.fr) sur le service `api` dans l'UI Coolify.
# Dev local : utiliser docker-compose.yml (runserver + n8n + dashboard Vite).
#
# Points clés :
# - `media` est PARTAGÉ entre api et worker : le worker Celery écrit les PDFs
#   WeasyPrint dans /app/media, l'api les sert sur /media/.
# - Aucun port Postgres/Redis exposé sur l'hôte (réseau Docker interne).
# - migrate + collectstatic s'exécutent au démarrage de l'api (idempotents).
# - `seed_formules` y figure aussi : sans lui, une base neuve n'a aucune formule
#   d'abonnement et l'espace client ne peut proposer aucun plan. Le laisser en
#   étape manuelle revient à l'oublier au prochain déploiement neuf. Sans
#   `--forcer`, il crée ce qui manque et ne touche jamais une formule ajustée
#   depuis l'administration.
# - `seed_boutique` suit la même logique : il crée les neuf fiches du catalogue
#   HORS LIGNE, prêtes à recevoir leur fichier. Aucune n'est vendable tant que
#   le document n'est pas déposé — `ProduitBoutique.est_publiable` le refuse.
#   Relancer la commande ne touche pas aux fiches déjà créées. En faire une
#   étape manuelle, c'est l'oublier, et l'API de Coolify n'expose aucune
#   exécution de commande dans le conteneur pour la rattraper.
# - `seed_formations` crée les trois fiches de formation HORS LIGNE, sans
#   module : la gérante saisit le programme puis met en ligne depuis
#   l'administration. Les pages publiques repèrent chaque formation par son
#   adresse (`methode-pop`…), d'où l'amorçage plutôt qu'une saisie libre.
#   Relancée, elle ne touche à aucune fiche existante. Elle non plus ne peut
#   pas faire tomber la plateforme : même liaison que la démonstration.
#
# - `seed_boutique_demo` remplit ces fiches de quoi MONTRER la boutique :
#   description, sommaire, couverture, PDF, extrait et avis. C'est un jeu de
#   DÉMONSTRATION, et sa page de garde le dit. Une fiche qui porte déjà un
#   document n'est jamais touchée : le jour où la cliente dépose sa vraie
#   étude, la démonstration s'efface d'elle-même du chemin. Sans ce garde-fou,
#   chaque déploiement écraserait son travail.
#
#   ELLE NE PEUT PAS FAIRE TOMBER LA PLATEFORME, et c'est pour cela qu'elle est
#   la seule étape de cette chaîne à ne pas être reliée par un `&&` sec.
#   Le 22/08/2026, `reportlab` n'était déclaré dans aucun extra : la commande a
#   levé `ModuleNotFoundError`, le `&&` a arrêté la chaîne, gunicorn n'a jamais
#   démarré. `api2.evkha.fr` ET `app2.evkha.fr` ont rendu 503 pendant vingt
#   minutes — pour un jeu de données de démonstration.
#
#   La dépendance est désormais déclarée (`pyproject.toml`, extra `word`), mais
#   ce n'est que la cause immédiate. La cause de fond est qu'une étape
#   COSMÉTIQUE avait le pouvoir d'empêcher l'API de servir. Aucune ne doit
#   l'avoir : les seeds qui suivent ce commentaire chargent des données, ils ne
#   conditionnent pas la capacité du serveur à répondre (règle 4 — viser la
#   classe, pas l'exemple).
#
#   ATTENTION AUX GUILLEMETS. Toute cette chaîne est UN SEUL argument de
#   `sh -c "…"`, entre guillemets doubles. Un `echo "…"` à l'intérieur ferme
#   donc la chaîne au milieu, et le conteneur redémarre en boucle sans qu'un
#   seul message n'explique pourquoi : le premier correctif de la panne du
#   22/08/2026 a fait exactement cela, et a prolongé la coupure de vingt
#   minutes. Les messages internes se citent avec des guillemets SIMPLES, et
#   sans apostrophe.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # `assurer_admin` vient APRES les migrations — il ecrit dans auth_user — et
    # AVANT gunicorn. Sans lui, personne ne peut entrer dans /admin/ :
    # `createsuperuser` est interactif, et l'API de Coolify n'expose aucune
    # execution de commande dans le conteneur. Sans EVKHA_ADMIN_EMAIL ni
    # EVKHA_ADMIN_PASSWORD, la commande ne fait rien et le dit.
    command: >
      sh -c "python manage.py changer_le_mot_de_passe_postgres
      && python manage.py migrate --noinput
      && python manage.py seed_offers
      && python manage.py seed_formules
      && python manage.py seed_boutique
      && (python manage.py seed_boutique_demo || echo 'AVERTISSEMENT - jeu de demonstration non depose, la boutique demarre vide')
      && (python manage.py seed_formations || echo 'AVERTISSEMENT - fiches de formation non creees, a creer depuis l administration')
      && python manage.py assurer_admin
      && python manage.py reinitialiser_la_plateforme
      && python manage.py collectstatic --noinput
      && gunicorn evkha.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    env_file: .env
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      # Domaine ET nom de routeur paramétrables. Ils étaient écrits en dur, ce
      # qui rendait impossible un second déploiement à côté du premier : la
      # nouvelle pile réclamait `app.evkha.fr` à Traefik, et la production
      # tombait. Les noms de routeurs entraient en collision de la même façon.
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-http.rule=Host(`${API_DOMAIN:?API_DOMAIN requis}`)"
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-http.entrypoints=http"
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-http.middlewares=redirect-to-https"
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-https.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-https.entrypoints=https"
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-https.tls=true"
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${STACK_NAME:-evkha}-api-https.middlewares=gzip"
      - "traefik.http.services.${STACK_NAME:-evkha}-api-svc.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - factstore:/app/fact_store
      # En lecture seule : la console dit l'âge de la dernière copie.
      - sauvegardes:/sauvegardes:ro
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A evkha worker --loglevel=INFO --concurrency=2
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - media:/app/media
      - factstore:/app/fact_store
    restart: unless-stopped

  # ── La livraison a sa propre file, et son propre ouvrier ──────────────────
  #
  # Le 17/08/2026, une cliente commande ses quatre études en une fois. Le
  # worker ci-dessus tient DEUX créneaux ; les quatre générations les occupent
  # pendant une heure. Les tâches de livraison — assembler le Word et le PDF,
  # envoyer l'e-mail — partent dans la même file et attendent derrière.
  #
  # Mesuré : l'étude de concurrence finit à 16:32, sa livraison part à 17:27.
  # Cinquante-cinq minutes pendant lesquelles un document TERMINÉ et PAYÉ
  # existait en base sans que rien ne l'envoie, et sans qu'aucun écran ne
  # puisse le dire — le dossier affichait « terminé ».
  #
  # Les deux travaux n'ont rien de comparable. Une génération dure quarante
  # minutes et coûte plusieurs euros ; un assemblage dure une minute et ne
  # coûte rien. Les faire patienter dans la même file revient à faire attendre
  # ce qui est déjà payé derrière ce qui n'est pas encore écrit.
  #
  # Concurrence 2 ici aussi : deux livraisons simultanées suffisent largement,
  # et LibreOffice consomme du processeur pendant la conversion PDF.
  #
  # ATTENTION si vous touchez à ceci : le routage vit dans
  # `CELERY_TASK_ROUTES` (`evkha/settings.py`), et les deux DOIVENT bouger
  # ensemble. Une file sans ouvrier, c'est zéro livraison — le défaut qu'on
  # répare, en pire.
  worker-livraison:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A evkha worker --loglevel=INFO --concurrency=2 -Q livraison
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - media:/app/media
      - factstore:/app/fact_store
      # En lecture seule : c'est cet ouvrier qui joue le témoin de sauvegarde
      # (`monitoring.verifier_la_sauvegarde`, file courte).
      - sauvegardes:/sauvegardes:ro
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A evkha beat --loglevel=INFO
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      # HTTP → redirect HTTPS
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-http.rule=Host(`${FRONT_DOMAIN:?FRONT_DOMAIN requis}`)"
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-http.entrypoints=http"
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-http.middlewares=redirect-to-https"
      # HTTPS + Let's Encrypt
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-https.rule=Host(`${FRONT_DOMAIN}`)"
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-https.entrypoints=https"
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-https.tls=true"
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${STACK_NAME:-evkha}-dashboard-https.middlewares=gzip"
      - "traefik.http.services.${STACK_NAME:-evkha}-dashboard-svc.loadbalancer.server.port=80"
      # ── Les domaines du site ne se règlent PAS ici ───────────────────────────
      # Mesuré le 19/11/2026 en ajoutant `evkha.fr` : Coolify échappe chaque `$`
      # de ces étiquettes (`$${STACK_NAME…}`), qui arrivent donc à Traefik comme
      # du texte, jamais comme des domaines. Le routage réel vient des étiquettes
      # que Coolify GÉNÈRE à partir du réglage « domaines » de l'application
      # (`docker_compose_domains`, un routeur et un certificat par domaine).
      # Des routeurs écrits ici pour `evkha.fr` ont été déployés et n'ont rien
      # routé — et Coolify avait accroché leur redirection aux routeurs de
      # `app2.evkha.fr`. Pour ajouter un domaine : le réglage de Coolify, puis
      # DJANGO_ALLOWED_HOSTS et CSRF_TRUSTED_ORIGINS. Le renvoi de `www` vers
      # le domaine nu est dans `frontend/nginx.conf`.
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evkha}
      POSTGRES_USER: ${POSTGRES_USER:-evkha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis en production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Une copie de la base chaque jour, trente et une gardées ──────────
  #
  # Audit du 19/11/2026 : la base vivait dans le volume `pgdata` et rien ne la
  # copiait — ni ce dépôt, ni l'hébergeur (API de Coolify : zéro base gérée).
  # Une migration fautive ou une suppression malheureuse était sans retour.
  #
  # Ce service écrit `evkha-jour-JJ.dump` (format `pg_restore`) dans le volume
  # `sauvegardes`, à son démarrage — donc à chaque déploiement — puis toutes
  # les vingt-quatre heures. Un emplacement par jour du mois : la copie du 19
  # remplace celle du 19 du mois précédent. Rien n'est jamais effacé par une
  # commande ; le volume porte au plus trente et une copies.
  #
  # La copie s'écrit d'abord sous un nom provisoire et ne prend son nom qu'une
  # fois complète : une copie interrompue ne remplace pas une copie saine.
  # Un échec est retenté dix minutes plus tard.
  #
  # IL N'EST PAS SEUL À VEILLER : `monitoring.verifier_la_sauvegarde` lit ce
  # volume depuis l'ouvrier de livraison et ouvre un incident quand la copie
  # du jour manque. Une sauvegarde que personne ne regarde échoue en silence.
  #
  # CE QUE CE SERVICE NE FAIT PAS : la copie reste sur ce serveur. Elle
  # protège d'une erreur, pas de la perte de la machine. La copie hors site
  # demande une destination et des clés qui ne sont pas dans ce dépôt.
  #
  # Le `$$` est un `$` pour le shell du conteneur : un seul serait lu par
  # Compose. Il n'y en a qu'un, à dessein, et aucun guillemet double.
  sauvegarde:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-evkha}
      PGUSER: ${POSTGRES_USER:-evkha}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis en production}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          if pg_dump --format=custom --file=/sauvegardes/en-cours.partiel && mv /sauvegardes/en-cours.partiel /sauvegardes/evkha-jour-$$(date +%d).dump; then
            echo sauvegarde ecrite
            sleep 86400
          else
            echo SAUVEGARDE EN ECHEC >&2
            sleep 600
          fi
        done
    volumes:
      - sauvegardes:/sauvegardes
    depends_on:
      - postgres
    restart: unless-stopped

  # Volume `redisbroker` depuis le 03/11/2026. La panne de ce jour-là venait
  # d'un `kombu` 5.7 incompatible avec redis-py 5 (voir `pyproject.toml`),
  # pas des données de Redis : ce volume neuf n'y était pour rien, mais il est
  # sans risque — il ne porte que la FILE des tâches. Dossiers, crédits et
  # documents vivent dans Postgres et le volume `media`.
  redis:
    image: redis:7-alpine
    volumes:
      - redisbroker:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  redisbroker:
  media:
  staticfiles:
  factstore:
  sauvegardes:
