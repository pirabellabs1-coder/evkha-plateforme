name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Tous les extras, pas seulement [dev] : sans eux, mypy ne voit ni
        # anthropic, ni httpx, ni bs4, et signale des dizaines de faux
        # "import-not-found" qui masquent les vraies erreurs. La CI echouait
        # ainsi sur main a chaque commit sans que personne ne puisse s'en
        # servir comme garde-fou. On installe ce que la prod installe.
        run: python -m pip install -e ".[dev,ai,search,pdf]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy backend

      - name: Pytest
        run: pytest

      - name: Check migrations
        env:
          # Sans .env, DJANGO_DEBUG retombe sur False et le runner se croit en
          # production : `check_webhook_secrets` passe alors de Warning a Error
          # et fait echouer l'etape sur des secrets qui n'ont AUCUNE raison
          # d'exister en CI. On ne neutralise pas le controle (il reste bloquant
          # en prod, ou DEBUG=False et ou les secrets doivent etre definis) : on
          # dit simplement la verite sur cet environnement.
          DJANGO_DEBUG: "True"
        run: python manage.py makemigrations --check --dry-run

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
