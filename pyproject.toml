[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systeme-evkha"
version = "0.1.0"
description = "Fondation backend du Systeme EVKHA."
requires-python = ">=3.12"
dependencies = [
  "celery>=5.4,<6",
  "django>=5.2,<6",
  # Le front est servi depuis un autre domaine que l'API (Vercel d'un cote,
  # le VPS de l'autre). Sans en-tetes CORS, le navigateur bloque tous les
  # appels. Une implementation maison serait une mauvaise idee : la
  # negociation CORS est subtile (preflight, Vary, credentials).
  "django-cors-headers>=4.4,<5",
  "django-environ>=0.11,<1",
  "gunicorn>=22,<24",
  "psycopg[binary]>=3.2,<4",
  # `generation/blocks.py` importe pydantic AU NIVEAU MODULE. La dependance
  # n'etait declaree nulle part : elle n'arrivait que transitivement via
  # `anthropic`, lui-meme dans l'extra optionnel [ai]. Une installation sans
  # cet extra plantait donc a l'import. Latent en prod (qui installe [ai]),
  # mais reel.
  "pydantic>=2,<3",
  "redis>=5,<6",
  # Encaissement des abonnements. Volontairement dans les dependances de base
  # et non dans un extra : le webhook Stripe est la SEULE porte par laquelle un
  # credit entre desormais dans un portefeuille. Une installation qui
  # l'oublierait ne ferait pas « moins de fonctionnalites », elle laisserait la
  # facturation muette sans que rien ne le signale.
  #
  # La bibliotheque officielle plutot qu'un appel HTTP direct : c'est elle qui
  # verifie la signature des webhooks (horodatage compris, donc anti-rejeu), et
  # une verification HMAC ecrite a la main sur un flux de paiement est
  # exactement le genre de code qu'on ne veut pas maintenir.
  "stripe>=10,<14",
]

[project.optional-dependencies]
ai = [
  "anthropic>=0.40,<1",
]
search = [
  # Recherche web GRATUITE (ancrage anti-hallucination §6) : DuckDuckGo,
  # aucune clé, aucun coût. httpx (déjà présent) sert au client Tavily optionnel.
  "ddgs>=6,<10",
  "httpx>=0.27,<1",
]
pdf = [
  # WeasyPrint génère les PDFs brandés (Phase 4b, D8).
  # Requiert des libs système (Pango, Cairo) — voir docs/deploy-coolify.md.
  # pydyf 0.12.x casse l'API transform() utilisée par weasyprint 62.x.
  "pydyf<0.12.0",
  "weasyprint>=62,<63",
  # BeautifulSoup4 : post-traitement DOM pour le chunking déterministe des
  # tableaux longs avant rendu WeasyPrint (chunk_long_tables).
  "beautifulsoup4>=4.12,<5",
  # pypdf : relit le PDF rendu par Gamma pour verifier qu'il n'a pas ampute le
  # document (delivery/gamma_fidelite.py). Gamma REECRIT le contenu — mesure
  # sur le BP SYNAPSES : 38 752 mots -> 3 835, 5 verticales sur 10 effacees.
  "pypdf>=4,<7",
]
word = [
  # Lot 3 : le livrable client est un Word produit a partir d'un gabarit, puis
  # converti en PDF. python-docx remplit le gabarit ; il ne le recree pas.
  "python-docx>=1.1,<2",
  # matplotlib dessine les quinze types de graphiques de `rendu_word/graphiques`.
  # Il n'etait declare NULLE PART : le rendu ne fonctionnait que parce que la
  # bibliotheque trainait dans l'environnement local. Le premier document
  # produit sur le serveur a echoue sur « No module named 'matplotlib' ».
  # Backend Agg impose dans le code : aucun serveur d'affichage sur le VPS.
  "matplotlib>=3.8,<4",
]
dev = [
  "django-stubs[compatible-mypy]>=5.2,<6",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-django>=4.8,<5",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `references/` contient les outils d'extraction du modele de reference, livres
# tels quels par la cliente et rejoues a la main sur un nouveau document. Les
# reformater ferait diverger la copie du depot de celle qu'elle execute chez
# elle. Ils ne sont ni importes ni deployes : les exclure garde la reference a
# 42 erreurs, donc une vraie regression du code applicatif reste visible.
extend-exclude = ["**/migrations/*.py", "references/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]

[tool.ruff.lint.isort]
known-first-party = [
  "catalog", "core", "customers", "dashboard",
  "delivery", "documents", "evkha", "generation",
  "intake", "integrations", "monitoring", "orders",
  "organisations",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
mypy_path = ["backend"]
exclude = ["backend/.*/migrations/.*"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Dependances sans stubs. `ddgs` / `duckduckgo_search` sont en plus des extras
# optionnels (`pip install systeme-evkha[search]`) : elles sont importees dans
# un try/except ImportError et peuvent legitimement etre absentes de l'env.
module = [
    "celery",
    "environ",
    "anthropic",
    "weasyprint",
    "ddgs",
    "duckduckgo_search",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.admin"]
disallow_any_generics = false

[tool.django-stubs]
django_settings_module = "evkha.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "evkha.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
