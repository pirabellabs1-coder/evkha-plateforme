server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/ → Django (réseau Docker interne — aucun CORS)
    #
    # `$host`, et surtout PAS un domaine écrit en dur. La valeur figée
    # `app.evkha.fr` faisait rejeter par Django, avec USE_X_FORWARDED_HOST=True,
    # toute requête venant d'un autre domaine : DisallowedHost, donc 400. La
    # page de l'espace client se chargeait — nginx la sert sans consulter
    # Django — et tous ses appels d'API échouaient derrière. Mesuré le
    # 30 juillet 2026 sur le déploiement `app2.evkha.fr` : 400 à travers ce
    # proxy, 401 attendu en attaquant l'API directement.
    #
    # `$host` suit le domaine réellement demandé. Il suffit qu'il figure dans
    # DJANGO_ALLOWED_HOSTS et CSRF_TRUSTED_ORIGINS, ce que les variables
    # d'environnement garantissent déjà.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA — toujours renvoyer index.html pour les routes React
    #
    # `$uri/` a été RETIRÉ, et ce n'est pas un détail de forme. Il demande à
    # nginx d'essayer le RÉPERTOIRE portant le nom de l'URL ; faute d'index à
    # l'intérieur, et l'autoindex étant désactivé, nginx répond 403.
    #
    # Or les fichiers statiques de Vite (`frontend/public/`) sont copiés tels
    # quels à la racine du site. Le jour où un dossier d'images porte le nom
    # d'une route, la route DISPARAÎT derrière lui.
    #
    # Mesuré le 05/08/2026 : `public/partenaires/` héberge les deux photos de
    # la page partenaires, et `https://app2.evkha.fr/partenaires` renvoyait 403
    # — c'est-à-dire la seule page publique du site, celle sur laquelle le menu
    # du tunnel de vente doit pointer. `/Partenaires`, avec une majuscule,
    # fonctionnait : la casse trahissait le répertoire.
    #
    # Sans `$uri/`, un répertoire ne satisfait plus le premier test et la route
    # tombe sur `index.html`, comme toutes les autres. Les fichiers, eux,
    # restent servis par `$uri` : `/partenaires/reunion.jpg` fonctionne.
    #
    # Corriger en renommant le dossier n'aurait réglé que ce cas-là ; demain
    # `credits/` ou `livrables/` produirait le même effet (règle 4).
    location / {
        try_files $uri /index.html;
    }
}
