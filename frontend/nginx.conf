# Un nom qui commence par `www.` renvoie au MÊME nom sans `www` : le site a une
# seule adresse, le domaine nu, choisie par le client à la bascule du
# 19/11/2026. Les deux noms arrivent à ce conteneur ; sans ce renvoi, le site
# existerait à deux adresses et les moteurs y verraient deux copies.
#
# Aucun domaine n'est écrit ici (`test_aucun_domaine_public_en_dur`) : la règle
# lit le nom demandé et en retire le préfixe, elle vaut donc pour tout domaine
# que Coolify route vers ce conteneur. 301, chemin et paramètres conservés
# (`$request_uri`). Le schéma est écrit en dur : Traefik termine le TLS, nginx
# ne voit que du HTTP.
server {
    listen 80;
    server_name ~^www\.(?<sans_www>.+)$;
    return 301 https://$sans_www$request_uri;
}

# L'ANCIEN NOM DE L'ESPACE (`app2.`) : ses pages PUBLIQUES renvoient au domaine
# nu. Le site y répondait encore, page pour page (mesuré le 21/11/2026 :
# `app2.…/etudes` rendait 200) : une seconde adresse pour chaque page, que
# seule la balise canonique départageait.
#
# `$domaine_nu` est vide pour tout autre nom : rien ne change pour lui. Comme
# pour `www`, aucun domaine n'est écrit ici — la règle retire le préfixe du nom
# demandé.
#
# Ce renvoi ne touche QUE les pages publiques (`location /`, l'accueil, les
# fiches de la boutique). L'espace client, l'administration, la connexion et
# `/api/` restent servis sous l'ancien nom : une session y est ouverte dans le
# navigateur de chaque personne, et la renvoyer ailleurs la déconnecterait —
# l'administration comprise, dont le jeton n'est pas un mot de passe qu'on
# retape. Les liens déjà partis par courriel (`/definir-mot-de-passe?…`,
# `/confirmer-adresse?…`) continuent donc d'ouvrir leur écran là où ils
# pointent.
map $host $domaine_nu {
    default "";
    "~^app2\.(?<reste>.+)$" $reste;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    # `robots.txt`, `llms.txt` et `sitemap.xml` portent des accents : sans
    # jeu de caractères annoncé, un lecteur les lit en Latin-1.
    charset utf-8;

    # Proxy /api/ → Django (réseau Docker interne — aucun CORS)
    #
    # `$host`, et surtout PAS un domaine écrit en dur. La valeur figée
    # `app.evkha.fr` faisait rejeter par Django, avec USE_X_FORWARDED_HOST=True,
    # toute requête venant d'un autre domaine : DisallowedHost, donc 400. La
    # page de l'espace client se chargeait — nginx la sert sans consulter
    # Django — et tous ses appels d'API échouaient derrière. Mesuré le
    # 30 juillet 2026 sur le déploiement `app2.evkha.fr` : 400 à travers ce
    # proxy, 401 attendu en attaquant l'API directement.
    #
    # `$host` suit le domaine réellement demandé. Il suffit qu'il figure dans
    # DJANGO_ALLOWED_HOSTS et CSRF_TRUSTED_ORIGINS, ce que les variables
    # d'environnement garantissent déjà.
    # 12 Mo — au-dessus des 10 Mo annoncés au client, marge pour l'enveloppe
    # multipart.
    #
    # SANS cette ligne, nginx applique son défaut : UN mégaoctet. Toute pièce
    # jointe plus lourde est rejetée en 413 avant même d'atteindre Django, dont
    # les réglages autorisent pourtant 10 Mo (`DATA_UPLOAD_MAX_MEMORY_SIZE`).
    # Le formulaire promettait « 10 Mo maximum » et refusait tout ce qui
    # dépassait un mégaoctet.
    #
    # Signalé deux fois par la cliente, dont « il ne s'ajoutait pas pourtant il
    # faisait 3,5 Mo ». Chercher la cause côté Django ne pouvait rien donner :
    # la requête n'y arrivait jamais.
    #
    # La borne vit ici ET dans `organisations.fichiers.TAILLE_MAX_DOCUMENT` ;
    # ce fichier n'est pas du Python et ne peut pas l'importer. Le test
    # `test_le_proxy_accepte_les_pieces_jointes` compare les deux et casse si
    # elles divergent (règle 5 — à défaut d'une source unique, un contrôle qui
    # les tient d'accord).
    client_max_body_size 12M;

    # `^~` : ce bloc l'emporte sur les expressions plus bas. Sans lui, une
    # adresse d'API finissant par `.html` serait prise par le bloc qui ferme
    # les fichiers pré-rendus, et ne parviendrait jamais à Django.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'en-tête est RELAYÉ tel que Traefik l'a écrit, et ce relais ne s'y
        # ajoute pas.
        #
        # `$proxy_add_x_forwarded_for` y ajoutait `$remote_addr` — c'est-à-dire
        # l'adresse de Traefik, seul à joindre ce conteneur. Django lit la
        # DERNIÈRE entrée (`EVKHA_PROXIES_DE_CONFIANCE=1`, voir
        # `organisations/limitation.py`) : il prenait donc Traefik pour le
        # visiteur, et tous les visiteurs pour un seul. Les plafonds « par
        # adresse » devenaient des plafonds pour la plateforme entière — cinq
        # inscriptions par heure, cinq réinitialisations de mot de passe, trente
        # connexions par quart d'heure, tous clients confondus (audit du
        # 19/11/2026).
        #
        # Le chemin direct (`api2.evkha.fr`, Traefik puis Django) n'a qu'un
        # relais et lisait juste : les deux chemins disent maintenant la même
        # chose. `test_le_relais_du_front_ne_se_prend_pas_pour_le_visiteur`
        # tient cette ligne et le réglage d'accord.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA — toujours renvoyer index.html pour les routes React
    #
    # `$uri/` a été RETIRÉ, et ce n'est pas un détail de forme. Il demande à
    # nginx d'essayer le RÉPERTOIRE portant le nom de l'URL ; faute d'index à
    # l'intérieur, et l'autoindex étant désactivé, nginx répond 403.
    #
    # Or les fichiers statiques de Vite (`frontend/public/`) sont copiés tels
    # quels à la racine du site. Le jour où un dossier d'images porte le nom
    # d'une route, la route DISPARAÎT derrière lui.
    #
    # Mesuré le 05/08/2026 : `public/partenaires/` héberge les deux photos de
    # la page partenaires, et `https://app2.evkha.fr/partenaires` renvoyait 403
    # — c'est-à-dire la seule page publique du site, celle sur laquelle le menu
    # du tunnel de vente doit pointer. `/Partenaires`, avec une majuscule,
    # fonctionnait : la casse trahissait le répertoire.
    #
    # Sans `$uri/`, un répertoire ne satisfait plus le premier test et la route
    # tombe sur `index.html`, comme toutes les autres. Les fichiers, eux,
    # restent servis par `$uri` : `/partenaires/reunion.jpg` fonctionne.
    #
    # Corriger en renommant le dossier n'aurait réglé que ce cas-là ; demain
    # `credits/` ou `livrables/` produirait le même effet (règle 4).
    #
    # `$uri.html` : LES PAGES PRÉ-RENDUES (20/11/2026). La construction écrit
    # un fichier HTML complet par page publique (`scripts/prerendre.mjs`) :
    # `/etudes` est servi par `etudes.html`, `/blog/un-article` par
    # `blog/un-article.html`. Sans lui, un robot qui n'exécute pas de
    # JavaScript recevait la même coquille vide à toutes les adresses —
    # mesuré : 3 659 octets, titre « Espace client », pour `/`, `/etudes` et
    # `/robots.txt` indifféremment.
    #
    # C'est un test de FICHIER, pas de répertoire : `/partenaires` trouve
    # `partenaires.html` à côté du dossier d'images du même nom, sans le 403
    # décrit plus haut. Toute autre adresse (espace client, administration,
    # fiche de la boutique) est dite plus bas, bloc par bloc.
    #
    # UNE ADRESSE INCONNUE RÉPOND 404 (20/11/2026). Le dernier recours de
    # `try_files` était `/index.html` : `/nimporte-quoi` répondait 200, avec
    # la coquille de l'application. Un moteur y voyait une page de plus, vide,
    # à chaque lien mal écrit. Le dernier recours est maintenant `=404`, et
    # `error_page` sert la coquille AVEC ce code : le visiteur voit toujours
    # la page « introuvable » du site, le robot lit le vrai code.
    #
    # Ce qui doit répondre 200 est donc DIT, ici et dans les blocs qui
    # suivent : les fichiers, les pages pré-rendues, les écrans de
    # l'application, les fiches de la boutique. Le test
    # `le-serveur-connait-chaque-route` rejoue chaque route du routeur contre
    # ce fichier : une route ajoutée sans y être dite le fait échouer. Et si
    # l'une d'elles manquait malgré tout, elle s'afficherait quand même — la
    # coquille est servie dans les deux cas, seul le code change.
    #
    # La barre finale : `/etudes/` renvoie à `/etudes`. Elle recevait la
    # coquille vide, sous une seconde adresse pour la même page. Posée ICI et
    # non au niveau du serveur : les routes de l'API finissent par une barre.
    #
    # Le motif n'admet que des lettres, des chiffres, `-`, `_`, `.` et `/`, et
    # commence par une lettre ou un chiffre. Écrit `^/(.+)/$`, il renvoyait
    # `/%5Cevil.com/` vers `/\evil.com` — qu'un navigateur lit `//evil.com`,
    # c'est-à-dire un AUTRE site, sous un lien qui affiche le nôtre (relecture
    # de sécurité du 20/11/2026). Toute autre adresse à barre finale suit son
    # cours : elle répond 404.
    location / {
        if ($domaine_nu) { return 301 https://$domaine_nu$request_uri; }
        rewrite "^/([A-Za-z0-9][A-Za-z0-9_./-]*)/$" /$1 permanent;
        try_files $uri $uri.html =404;
    }

    # La coquille, avec le code 404, pour toute adresse que rien ne sert.
    error_page 404 /index.html;

    # Les renvois de ce fichier s'écrivent SANS nom de domaine ni schéma :
    # nginx ne voit que du HTTP derrière Traefik, et aucun domaine n'est écrit
    # ici. Le navigateur garde le nom et le schéma qu'il a demandés.
    absolute_redirect off;

    # Un fichier pré-rendu ne se demande pas par son nom : `/etudes.html`
    # servait la page des études sous une seconde adresse, et `/accueil.html`
    # l'accueil. Seul nginx les lit, de l'intérieur. `index.html` reste
    # joignable : c'est la coquille, que `organisations.pages_boutique` vient
    # lire ici par le réseau interne.
    location ~ ^/(?!index\.html$).+\.html$ {
        internal;
    }
    location = /accueil {
        return 301 /;
    }

    # LES ÉCRANS DE L'APPLICATION : la coquille, en 200. Chaque préfixe est
    # celui d'une route de `router.tsx` (`/acheter/<offre>`, `/espace/...`).
    # ecrans-de-l-application
    location ~ ^/(admin|espace|login|inscription|acheter|definir-mot-de-passe|mot-de-passe-oublie|confirmer-adresse)(/|$) {
        try_files /index.html =404;
    }
    # Les deux retours de paiement, à leur adresse figée dans Stripe. Une
    # égalité stricte passe avant le bloc des fiches, plus bas : sans elle,
    # `/boutique/retour` serait lu comme la fiche d'une étude nommée « retour ».
    location = /boutique/retour {
        try_files /index.html =404;
    }
    location = /formations/retour {
        try_files /index.html =404;
    }

    # LES FICHES DE LA BOUTIQUE. Leur contenu est en base : Django écrit la
    # page (`organisations.pages_boutique.page`) — la coquille de
    # l'application, avec le titre, l'adresse canonique, les données
    # structurées et le texte de l'étude ; 404 pour une étude qui n'est pas en
    # vente. Les mêmes en-têtes que le bloc `/api/` plus haut.
    #
    # Si Django ne répond pas, ou ne peut pas écrire la page (5xx), nginx sert
    # la coquille seule, en 200 : le visiteur a sa fiche par l'application,
    # comme avant. Une panne de l'API ne doit pas fermer la boutique.
    location ~ ^/boutique/(?<etude>[-a-zA-Z0-9_]+)$ {
        if ($domaine_nu) { return 301 https://$domaine_nu$request_uri; }
        # `rewrite … break` puis un `proxy_pass` SANS chemin : écrit avec une
        # variable, `proxy_pass` demanderait à nginx de résoudre `api` à
        # chaque requête, ce qu'il ne sait faire qu'avec un `resolver`.
        rewrite ^ /api/public/boutique/$etude/page/ break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Django rend la page en quelques millisecondes. S'il tarde, c'est une
        # panne : on n'attend pas les soixante secondes par défaut pour servir
        # la coquille à quelqu'un qui vient acheter.
        proxy_connect_timeout 2s;
        proxy_read_timeout 6s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =200 /index.html;
        # Une étude qui n'est pas en vente : Django répond 404 sans corps, et
        # nginx sert la coquille avec ce code, comme pour toute adresse
        # inconnue. Redit ICI : un bloc qui pose ses propres `error_page`
        # n'hérite plus de celles du serveur.
        error_page 404 /index.html;
    }

    # Le plan du site des fiches en vente, écrit par Django à la demande :
    # une étude mise en ligne par la gérante y figure sans mise en production.
    # `robots.txt` le déclare à côté de `sitemap.xml`.
    location = /sitemap-boutique.xml {
        proxy_pass http://api:8000/api/public/boutique/plan.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # LES ANCIENNES ADRESSES du site (Systeme.io), encore dans les moteurs,
    # les courriels et les favoris : un renvoi PERMANENT, lu par les robots.
    # Le routeur les renvoyait déjà, mais dans le navigateur seulement — un
    # robot sans JavaScript y recevait la coquille vide. Les paramètres
    # suivent (`?utm_source=…`) ; l'ancre, le navigateur la garde de lui-même.
    #
    # La liste est celle de `router.tsx` (`ANCIENNES_ADRESSES`), que le
    # routeur garde pour un lien suivi à l'intérieur de l'application. Le test
    # `le-serveur-connait-chaque-route` tient les deux d'accord.
    # anciennes-adresses
    location = /formation { return 301 /formations$is_args$args; }
    location = /achat-formationsociete { return 301 /formations/creer-son-entreprise$is_args$args; }
    location = /achat-formationmicro { return 301 /formations/creer-sa-micro-entreprise$is_args$args; }
    location = /achat-formationpop { return 301 /formations/methode-pop$is_args$args; }
    location = /etude { return 301 /etudes$is_args$args; }
    location = /etudedemarche { return 301 /etudes$is_args$args; }
    location = /etude-achat-immediat { return 301 /boutique$is_args$args; }
    location = /partenairespro { return 301 /partenaires$is_args$args; }
    location = /boite-a-outil { return 301 /boite-a-outils$is_args$args; }
    location = /contacts { return 301 /contact$is_args$args; }
    location = /contacte { return 301 /contact$is_args$args; }
    location = /boite-a-outils/idee-business-viable { return 301 /blog/idee-business-viable$is_args$args; }
    # fin-des-anciennes-adresses

    # L'accueil a son propre fichier : `index.html` reste la coquille VIDE de
    # l'application. Y écrire l'accueil le ferait apparaître sous chaque écran
    # de l'espace client, et le servirait à un robot pour toute adresse
    # inconnue. Si le fichier manque, la coquille prend le relais.
    location = / {
        if ($domaine_nu) { return 301 https://$domaine_nu$request_uri; }
        try_files /accueil.html /index.html;
    }

    # Les fichiers de Vite portent une empreinte de leur contenu dans leur
    # nom : un fichier modifié change de nom. Ils se gardent donc un an sans
    # jamais redemander — aucun en-tête de cache n'était posé, et chaque
    # visite retéléchargeait ou revalidait tout. Un fichier absent répond 404,
    # et non la coquille HTML avec un code 200 : un navigateur qui demande un
    # morceau d'une version retirée doit le savoir.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
