# Un nom qui commence par `www.` renvoie au MÊME nom sans `www` : le site a une
# seule adresse, le domaine nu, choisie par le client à la bascule du
# 19/11/2026. Les deux noms arrivent à ce conteneur ; sans ce renvoi, le site
# existerait à deux adresses et les moteurs y verraient deux copies.
#
# Aucun domaine n'est écrit ici (`test_aucun_domaine_public_en_dur`) : la règle
# lit le nom demandé et en retire le préfixe, elle vaut donc pour tout domaine
# que Coolify route vers ce conteneur. 301, chemin et paramètres conservés
# (`$request_uri`). Le schéma est écrit en dur : Traefik termine le TLS, nginx
# ne voit que du HTTP.
server {
    listen 80;
    server_name ~^www\.(?<sans_www>.+)$;
    return 301 https://$sans_www$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    # `robots.txt`, `llms.txt` et `sitemap.xml` portent des accents : sans
    # jeu de caractères annoncé, un lecteur les lit en Latin-1.
    charset utf-8;

    # Proxy /api/ → Django (réseau Docker interne — aucun CORS)
    #
    # `$host`, et surtout PAS un domaine écrit en dur. La valeur figée
    # `app.evkha.fr` faisait rejeter par Django, avec USE_X_FORWARDED_HOST=True,
    # toute requête venant d'un autre domaine : DisallowedHost, donc 400. La
    # page de l'espace client se chargeait — nginx la sert sans consulter
    # Django — et tous ses appels d'API échouaient derrière. Mesuré le
    # 30 juillet 2026 sur le déploiement `app2.evkha.fr` : 400 à travers ce
    # proxy, 401 attendu en attaquant l'API directement.
    #
    # `$host` suit le domaine réellement demandé. Il suffit qu'il figure dans
    # DJANGO_ALLOWED_HOSTS et CSRF_TRUSTED_ORIGINS, ce que les variables
    # d'environnement garantissent déjà.
    # 12 Mo — au-dessus des 10 Mo annoncés au client, marge pour l'enveloppe
    # multipart.
    #
    # SANS cette ligne, nginx applique son défaut : UN mégaoctet. Toute pièce
    # jointe plus lourde est rejetée en 413 avant même d'atteindre Django, dont
    # les réglages autorisent pourtant 10 Mo (`DATA_UPLOAD_MAX_MEMORY_SIZE`).
    # Le formulaire promettait « 10 Mo maximum » et refusait tout ce qui
    # dépassait un mégaoctet.
    #
    # Signalé deux fois par la cliente, dont « il ne s'ajoutait pas pourtant il
    # faisait 3,5 Mo ». Chercher la cause côté Django ne pouvait rien donner :
    # la requête n'y arrivait jamais.
    #
    # La borne vit ici ET dans `organisations.fichiers.TAILLE_MAX_DOCUMENT` ;
    # ce fichier n'est pas du Python et ne peut pas l'importer. Le test
    # `test_le_proxy_accepte_les_pieces_jointes` compare les deux et casse si
    # elles divergent (règle 5 — à défaut d'une source unique, un contrôle qui
    # les tient d'accord).
    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'en-tête est RELAYÉ tel que Traefik l'a écrit, et ce relais ne s'y
        # ajoute pas.
        #
        # `$proxy_add_x_forwarded_for` y ajoutait `$remote_addr` — c'est-à-dire
        # l'adresse de Traefik, seul à joindre ce conteneur. Django lit la
        # DERNIÈRE entrée (`EVKHA_PROXIES_DE_CONFIANCE=1`, voir
        # `organisations/limitation.py`) : il prenait donc Traefik pour le
        # visiteur, et tous les visiteurs pour un seul. Les plafonds « par
        # adresse » devenaient des plafonds pour la plateforme entière — cinq
        # inscriptions par heure, cinq réinitialisations de mot de passe, trente
        # connexions par quart d'heure, tous clients confondus (audit du
        # 19/11/2026).
        #
        # Le chemin direct (`api2.evkha.fr`, Traefik puis Django) n'a qu'un
        # relais et lisait juste : les deux chemins disent maintenant la même
        # chose. `test_le_relais_du_front_ne_se_prend_pas_pour_le_visiteur`
        # tient cette ligne et le réglage d'accord.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA — toujours renvoyer index.html pour les routes React
    #
    # `$uri/` a été RETIRÉ, et ce n'est pas un détail de forme. Il demande à
    # nginx d'essayer le RÉPERTOIRE portant le nom de l'URL ; faute d'index à
    # l'intérieur, et l'autoindex étant désactivé, nginx répond 403.
    #
    # Or les fichiers statiques de Vite (`frontend/public/`) sont copiés tels
    # quels à la racine du site. Le jour où un dossier d'images porte le nom
    # d'une route, la route DISPARAÎT derrière lui.
    #
    # Mesuré le 05/08/2026 : `public/partenaires/` héberge les deux photos de
    # la page partenaires, et `https://app2.evkha.fr/partenaires` renvoyait 403
    # — c'est-à-dire la seule page publique du site, celle sur laquelle le menu
    # du tunnel de vente doit pointer. `/Partenaires`, avec une majuscule,
    # fonctionnait : la casse trahissait le répertoire.
    #
    # Sans `$uri/`, un répertoire ne satisfait plus le premier test et la route
    # tombe sur `index.html`, comme toutes les autres. Les fichiers, eux,
    # restent servis par `$uri` : `/partenaires/reunion.jpg` fonctionne.
    #
    # Corriger en renommant le dossier n'aurait réglé que ce cas-là ; demain
    # `credits/` ou `livrables/` produirait le même effet (règle 4).
    #
    # `$uri.html` : LES PAGES PRÉ-RENDUES (20/11/2026). La construction écrit
    # un fichier HTML complet par page publique (`scripts/prerendre.mjs`) :
    # `/etudes` est servi par `etudes.html`, `/blog/un-article` par
    # `blog/un-article.html`. Sans lui, un robot qui n'exécute pas de
    # JavaScript recevait la même coquille vide à toutes les adresses —
    # mesuré : 3 659 octets, titre « Espace client », pour `/`, `/etudes` et
    # `/robots.txt` indifféremment.
    #
    # C'est un test de FICHIER, pas de répertoire : `/partenaires` trouve
    # `partenaires.html` à côté du dossier d'images du même nom, sans le 403
    # décrit plus haut. Toute autre adresse (espace client, administration,
    # fiche de la boutique) retombe sur `index.html`, la coquille de
    # l'application, comme avant.
    location / {
        try_files $uri $uri.html /index.html;
    }

    # L'accueil a son propre fichier : `index.html` reste la coquille VIDE de
    # l'application. Y écrire l'accueil le ferait apparaître sous chaque écran
    # de l'espace client, et le servirait à un robot pour toute adresse
    # inconnue. Si le fichier manque, la coquille prend le relais.
    location = / {
        try_files /accueil.html /index.html;
    }

    # Les fichiers de Vite portent une empreinte de leur contenu dans leur
    # nom : un fichier modifié change de nom. Ils se gardent donc un an sans
    # jamais redemander — aucun en-tête de cache n'était posé, et chaque
    # visite retéléchargeait ou revalidait tout. Un fichier absent répond 404,
    # et non la coquille HTML avec un code 200 : un navigateur qui demande un
    # morceau d'une version retirée doit le savoir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
