services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A evkha worker --loglevel=INFO
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A evkha beat --loglevel=INFO
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evkha}
      POSTGRES_USER: ${POSTGRES_USER:-evkha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evkha}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  dashboard:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ""          # vide = proxy Vite vers web:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - web

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-evkha}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-evkha}
    ports:
      - "5678:5678"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
